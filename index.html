<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#2c3e50">
    <link rel="manifest" href="manifest.json">
    <title>Отдел знаний</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header" id="appHeader">
        <div class="header-top">
            <h1 class="app-title">Отдел знаний</h1>
            <nav class="nav-tabs" id="navTabs">
                <button class="nav-btn active" data-page="guides">Справочники</button>
                <button class="nav-btn" data-page="tests">Тесты</button>
            </nav>
        </div>
        <div class="search-wrapper" id="searchWrapper">
            <input type="search" id="searchInput" class="search-input" placeholder="Поиск по разделам..." autocomplete="off" disabled>
        </div>
    </header>

    <main class="app-main" id="appMain">
        <div class="loader" id="loader">Загрузка данных...</div>
        <div id="contentContainer" class="content-container"></div>
    </main>

    <div class="modal-overlay" id="modalOverlay" style="display: none;">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script src="xlsx.full.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
